<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Nahwu: Uji pemahaman Kalam, I'rab, Macam-macam i'rab</title>
    <meta name="description" content="Uji pemahaman Kalam, I'rab, Macam-macam i'rab">
    <meta property="og:title" content="Uji pemahaman Kalam, I'rab, Macam-macam i'rab">
    <meta property="og:description" content="Ayo uji kemampuan Nahwu antum dengan kuis interaktif ini!">
    <meta property="og:image" content="https://arifabdrohim52-sys.github.io/Nahu/6.jpg">
    <meta property="og:url" content="https://arifabdrohim52-sys.github.io/Nahu/Kalam.html">
    <meta property="og:type" content="website">
    
    <!-- Google Fonts: Amiri, Montserrat, Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f4f6f8; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .quiz-container { 
            width: 95%; 
            max-width: 700px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            background: #fff; 
            overflow: hidden; 
        }
        .hidden { display: none; }
        
        /* Pengaturan Teks Arab RTL */
        .arab { 
            font-family: 'Amiri', serif; 
            direction: rtl; 
            text-align: right; 
            font-size: 1.35em; 
            line-height: 2; 
        }
        
        /* Container Soal & Pilihan Berarah RTL */
        .rtl-container {
            direction: rtl;
            text-align: right;
        }

        .answers button { 
            display: block; 
            width: 100%; 
            margin: 10px 0; 
            padding: 14px 18px; 
            border: 2px solid #3498db; 
            border-radius: 12px; 
            text-align: right; 
            direction: rtl;
            transition: .25s; 
        }
        .answers button.correct { 
            background: #2ecc71 !important; 
            color: #fff; 
            border-color: #27ae60; 
        }
        .answers button.wrong { 
            background: #e74c3c !important; 
            color: #fff; 
            border-color: #c0392b; 
        }
        .overlay-box { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(255,255,255,0.95); 
            padding: 2rem; 
            border-radius: 1.5rem; 
            width: 85%; 
            max-width: 350px; 
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); 
            backdrop-filter: blur(4px); 
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- HALAMAN INTRO -->
    <div id="intro" class="relative text-center">
        <img src="./4.png" alt="Sampul" class="w-full brightness-50 object-cover min-h-[400px]">
        <div class="overlay-box">
            <h1 class="text-xl font-bold mb-4 text-gray-800">Uji pemahaman Kalam, I'rab, Macam-macam i'rab</h1>
            <input type="text" id="name" placeholder="Nama Antum" class="w-full p-3 mb-3 border rounded-xl outline-none focus:border-blue-500">
            <input type="text" id="region" placeholder="Daerah Antum" class="w-full p-3 mb-4 border rounded-xl outline-none focus:border-blue-500">
            <button id="btnStart" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition-all">Mulai Kuis</button>
        </div>
    </div>

    <!-- HALAMAN KUIS -->
    <div id="quiz" class="hidden p-6">
        <div class="flex justify-between items-center mb-4">
            <span id="question-label" class="text-blue-600 font-bold text-xs uppercase tracking-widest"></span>
            <div id="timer-display" class="bg-red-100 text-red-600 px-4 py-1 rounded-full font-bold">⏱️ <span id="time-left">20</span>s</div>
        </div>
        <div id="question-container" class="rtl-container"></div>
        <button id="nextBtn" class="hidden w-full mt-6 py-3 bg-blue-600 text-white font-bold rounded-xl">Lanjut ➡️</button>
    </div>

    <!-- HALAMAN HASIL -->
    <div id="result" class="hidden p-0 text-center">
        <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-8 text-white">
            <h1 class="text-xl font-semibold opacity-90 mb-2">Tes Selesai!</h1>
            <div class="flex justify-center my-4">
                <div class="relative">
                    <div id="scoreCircle" class="w-32 h-32 rounded-full border-8 border-white/20 flex items-center justify-center text-5xl font-extrabold shadow-2xl transition-all duration-1000">0</div>
                    <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-white text-blue-600 px-4 py-1 rounded-full text-[10px] font-bold shadow-md whitespace-nowrap uppercase">SKOR AKHIR</div>
                </div>
            </div>
            <p id="resQual" class="text-lg font-bold mb-1"></p>
            <div id="rankText" class="text-sm opacity-80 font-medium italic">Memproses data...</div>
        </div>

        <div class="p-8 bg-white">
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="text-left p-3 rounded-xl bg-gray-50 border border-gray-100">
                    <p class="text-[10px] uppercase text-gray-400 font-bold">Nama</p>
                    <p id="resName" class="font-semibold text-gray-700 truncate"></p>
                </div>
                <div class="text-left p-3 rounded-xl bg-gray-50 border border-gray-100">
                    <p class="text-[10px] uppercase text-gray-400 font-bold">Daerah</p>
                    <p id="resRegion" class="font-semibold text-gray-700 truncate"></p>
                </div>
            </div>

            <div class="mb-8 p-4 rounded-2xl bg-red-50 border border-red-100 text-left">
                <p class="text-xs font-bold text-red-800 uppercase mb-1">Perlu Muraja'ah Soal:</p>
                <p id="resWrongNumbers" class="text-sm text-red-700 font-medium"></p>
            </div>
            
            <div class="space-y-3">
                <button id="btnSertifikat" disabled class="w-full py-4 bg-gray-200 text-gray-400 font-bold rounded-2xl cursor-not-allowed transition-all italic">⏳ Tunggu Sertifikat...</button>
                <button id="btnRaport" disabled class="w-full py-4 bg-gray-200 text-gray-400 font-bold rounded-2xl transition-all opacity-50 italic">⏳ Tunggu Raport...</button>
                <button id="btnRetry" class="w-full py-4 bg-blue-100 text-blue-700 font-bold rounded-2xl hover:bg-blue-200 transition-all border border-blue-200">🔄 Ulangi Kuis</button>
            </div>
        </div>
    </div>

    <!-- HALAMAN RAPORT GLOBAL -->
    <div id="raportPage" class="hidden p-6">
        <h1 class="text-xl font-bold mb-4 text-center text-gray-800 italic underline">Raport Global</h1>
        
        <div class="mb-6 p-4 bg-amber-50 rounded-2xl border border-amber-200 text-left">
            <h3 class="text-xs font-bold text-amber-800 uppercase mb-3 flex items-center gap-2">⚠️ Rekapitulasi Soal Sulit (Global)</h3>
            <div id="analyticsList" class="flex flex-wrap gap-2"></div>
        </div>

        <h3 class="text-xs font-bold text-gray-400 uppercase mb-3 text-left">Peringkat & Kualifikasi Peserta</h3>
        <div id="raportList" class="space-y-2 max-h-80 overflow-y-auto pr-2"></div>
        <button id="btnBackToResult" class="w-full mt-6 py-3 bg-gray-800 text-white rounded-xl font-bold">Kembali</button>
    </div>
</div>

<canvas id="certCanvas" width="1200" height="900" class="hidden"></canvas>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzllXMsKSYHCjTTYTR97YC8A1Bh4jqpRsth_s_B0pEmzYmD2Bd-VfBjOPgT2TQWGwXz/exec";

let currentUserToken = '';
let currentQuestion = 0;
let score = 0;
let userName = '';
let userRegion = '';
let countdown;
let timeLeft = 20;
let allData = [];
let wrongQuestions = [];

const questions = [
    {
        q: "اللفظُ والتركيبُ والإفادةُ والوضعُ من الأجزاء __ من الكلام.",
        options: ["العرفية", "الحقيقية", "اللفظية", "الإضافية"],
        a: 1,
        exp: "هذه الأربعة تُسمَّى الأجزاء الحقيقية؛ لأن حقيقة الكلام في اصطلاح النحاة لا تتحقق إلا بمجموعها، فإذا اختلّ واحدٌ منها بَطُلَ كونُه كلامًا."
    },
    {
        q: "\"وأقسامُه ثلاثةٌ: اسمٌ وفعلٌ وحرفٌ جاءَ لمعنى\". المُرادُ بـ \"أقسامِه\" هنا:",
        options: ["الأجزاء الحقيقية من الكلام", "الأجزاء العرفية من الكلام", "الشروط اللفظية للكلام", "العلامات الفرعية للكلام"],
        a: 1,
        exp: "تقسيم الكلام إلى اسم وفعل وحرف هو تقسيمٌ بحسب الأجزاء العُرفية حيث أن الكلام يتحقق وإن لم تكتمل هذه الأجزاء"
    },
    {
        q: "معنى \"علامات الشيء\" في اصطلاح النحاة:",
        options: ["ما به يتحقق الشيء", "أن يختص بكل أفراد الشيء ولا يوجد في غيره", "أن يختص ببعض أفراد الشيء ولا يوجد في غيره", "الأجزاء الحقيقية من الشيء"],
        a: 2,
        exp: "يكفي كون الشيء للشيء علامة عليه أن يختص ببعض أفراده"
    },
    {
        q: "دخولُ حرف الخفض على كلمةٍ علامةٌ على كونها اسمًا، لأن:",
        options: ["الخفض لا يكون إلا للأفعال", "المجرور هو مسند إليه في المعنى", "المجرور هو مسند إليه في اللفظ", "الاسم لا يكون إلا مبنيًا"],
        a: 1,
        exp: "دَخَلَ الخفضُ على الاسم خاصةً؛ لأن المجرور بحرف الجر هو في المعنى مُسْنَدٌ إليه (تعلّق به الحكم)، والإسنادُ من خصائص الأسماء دون الأفعال والحروف"
    },
    {
        q: "الإعرابُ حقيقةً هو:",
        options: ["اللفظ المخصوص", "التغير المخصوص", "التغيير المخصوص", "السكون المخصوص"],
        a: 1,
        exp: "الإعراب حقيقةً عند من يرى انه معنوي هو التغَيُّرُ المخصوص الذي يحدث في أواخر الكلم بااختلاف العوامل، وليس هو تغيير لأنه فعل الفاعل."
    },
    {
        q: "سُمِّيَ الرفعُ \"رَفْعًا\" لأن:",
        options: ["الشفةَ عند النطق بالعلامة الأصلية كأنها تعلو", "الصوت ينخفض عند النطق به", "الحرف الأخير يخرج من أقصى الحلق", "الكلمة ترتفع عن الإعراب إلى البناء"],
        a: 0,
        exp: "التسمية ناتجة عن الملاحظة الصوتية؛ إذ إن الشفتين ترتفعان وتتجهان إلى الأعلى عند التلفظ بالحركة الأصل للرفع وهي الضمة."
    },
    {
        q: "المراد بـ \"الاسم المفرد\" في باب الإعراب هو:",
        options: ["ما دل على غير المركب", "ما يقابل المجموع بنوعين والمثنى وملحقًا بهما وأسماء الخمسة", "ما ليس مضافًا ولا شبيهًا بالمضاف", "ما كان خبرًا غير جملة ولا شبه جملة"],
        a: 1,
        exp: "\"المفرد\" مصطلح يتغير مراده بحسب الباب؛ ففي باب الإعراب يراد به: ما ليس مثنى، ولا مجموعًا، ولا ملحقًا بهما، ولا من الأسماء الخمسة."
    },
    {
        q: "في قول صاحب الأجرومية: \"والفعل المضارع الذي لم يتصل بآخره شيء\"، المراد بـ \"شيء\":",
        options: ["ما ينقل إعرابه أو ما يبنى به", "ألف الاثنين وواو الجمع", "نون النسوة والتوكيد", "أل التعريف والإنكار"],
        a: 0,
        exp: "المراد بـ \"شيء\" أمران: ما ينقل إعرابه من الضمة إلى الثبوت (نون الرفع في الأفعال الخمسة)، أو ما يخرجه من الإعراب إلى البناء (نون التوكيد ونون النسوة)."
    },
    {
        q: "إعراب الفعل \"يكتبُنَّ\" في جملة (الناسُ يكتبُنَّ):",
        options: ["فعل مضارع مبني على الفتح لاتصاله بنون التوكيد", "فعل مضارع مرفوع وعلامة رفعه ثبوت النون المحذوفة لدفع توالي الأمثال", "فعل مضارع مجزوم وعلامة جزمة حذف النون", "فعل مضارع مرفوع بالضمة الظاهرة على آخره"],
        a: 1,
        exp: "الفعل معرب وليس مبنيًا؛ لأن نون التوكيد لم تباشره (فصل بينهما واو الجماعة المحذوفة)، وأصله: (يكتبونَنَّ)، فحُذفت نون الرفع لتوالي الأمثال، فصار مرفوعًا بـ نون مقدرة/محذوفة."
    },
    {
        q: "المراد بـ \"دفع توالي الأمثال\" في نحو (يكتبُنَّ):",
        options: ["منع التقاء الساكنين", "منع وجود النونات الثلاثة متتالية", "منع دخول حرف الجر على الفعل", "منع التنوين في الممنوع من الصرف"],
        a: 1,
        exp: "أصل الكلمة اجتماع ٣ نونات متتالية (نون الرفع + نون التوكيد المشددة المكونة من نونين)، وكراهة اجتماع الأمثال المتماثلة في كلام العرب أدت إلى حذف نون الرفع."
    },
    {
        q: "في عبارة \"تثنية الأسماء\"، هل المراد بـ \"التثنية\" هنا حقيقتها (المصدر)؟",
        options: ["نعم، المراد المصدر نفسه", "لا، بل المراد اسم المفعول منه وهو \"المثنى\"", "لا، بل المراد الجمع المذكر السالم", "نعم، لأن المصدر يدل على العدد"],
        a: 1,
        exp: "عبارة \"تثنية الأسماء\" جاءت من باب إطلاق المصدر وإرادة اسم المفعول؛ فالمراد ليس الفعل النفسي (التثنية)، وإنما اللفظ الذي وقعت عليه التثنية وهو المُثَنَّى."
    },
    {
        q: "العَلَميةُ فرعٌ من __، والتأنيثُ فرعٌ من __:",
        options: ["المعرفة / التذكير", "النكرة / التذكير", "الوصفية / الإفراد", "الإضافة / التركيب"],
        a: 1,
        exp: "علل منع الصرف ترجع إلى فرعية في اللفظ أو المعنى؛ فالعلَمية فرعٌ عن النكرة (لأن الأصل في الأسماء التنكير)، والتأنيث فرعٌ عن التذكير (لأن الأصل هو المذكر)."
    },
    {
        q: "حكمُ كلمةِ \"أَمَل\" (علم مؤنث) من حيث الصرفُ:",
        options: ["مصروفة لأنها اسم علم ثلاثي", "ممنوعة من الصرف لأنها علم مؤنث متحرك الوسط", "يجوز فيها الصرف والمنع مطلقًا", "مبنية على السكون دائمًا"],
        a: 1,
        exp: "العلم المؤنث الثلاثي إذا كان متحرك الوسط (مثل: أَمَل بفتح الميم) يمنع من الصرف وجوبًا، ولا يجوز فيه الصرف."
    },
    {
        q: "حكمُ كلمةِ \"هِنْدٌ\" من حيث الصرفُ:",
        options: ["ممنوعة من الصرف وجوبًا لأنها علم مؤنث", "يجوز فيها الصرف والمنع لأنها علم مؤنث ثلاثي ساكن الوسط", "ممنوعة من الصرف للتركيب المزجي", "غير معربة مطلقًا"],
        a: 1,
        exp: "العلم المؤنث الثلاثي إذا كان ساكن الوسط (مثل: هِنْد بسكون النون) جاز فيه وجهان: الصرف (وهو الأفضل) والمنع من الصرف."
    }
];

function formatArabic(text) { 
    return `<span class="arab">${text}</span>`; 
}

function getCategoryData(p) {
    if (p >= 90) return { qual: "Mumtaz", color: "text-green-600", bg: "bg-green-600", hex: "#16a34a", lightBg: "bg-green-50" };
    if (p >= 80) return { qual: "Jayyid Jiddan", color: "text-blue-600", bg: "bg-blue-600", hex: "#2563eb", lightBg: "bg-blue-50" };
    if (p >= 65) return { qual: "Jayyid", color: "text-yellow-600", bg: "bg-yellow-600", hex: "#ca8a04", lightBg: "bg-yellow-50" };
    if (p >= 50) return { qual: "Maqbul", color: "text-orange-600", bg: "bg-orange-600", hex: "#ea580c", lightBg: "bg-orange-50" };
    return { qual: "Rasib", color: "text-red-600", bg: "bg-red-600", hex: "#dc2626", lightBg: "bg-red-50" };
}

function startTimer() {
    clearInterval(countdown);
    timeLeft = 20;
    document.getElementById('time-left').innerText = timeLeft;
    countdown = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft;
        if (timeLeft <= 0) { 
            clearInterval(countdown); 
            handleTimeout(); 
        }
    }, 1000);
}

function handleTimeout() {
    const q = questions[currentQuestion];
    document.querySelectorAll('.answers button').forEach((b, i) => {
        b.disabled = true;
        if (i === q.a) b.classList.add('correct');
    });
    wrongQuestions.push(currentQuestion + 1);
    document.getElementById('exp').innerHTML = `<div class="text-red-600 font-bold mb-2 text-left">⏰ Waktu Habis! Poin soal ini hangus.</div><strong class="block text-right">الشرح :</strong><br>${formatArabic(q.exp)}`;
    document.getElementById('exp').classList.remove('hidden');
    document.getElementById('nextBtn').classList.remove('hidden');
}

document.getElementById('btnStart').onclick = () => {
    userName = document.getElementById('name').value.trim();
    userRegion = document.getElementById('region').value.trim();
    if (!userName || !userRegion) return alert("Isi Nama & Daerah!");
    currentUserToken = "ID-" + Date.now();
    document.getElementById('intro').classList.add('hidden');
    document.getElementById('quiz').classList.remove('hidden');
    loadQuestion();
};

function loadQuestion() {
    const q = questions[currentQuestion];
    document.getElementById('question-label').innerText = `Soal ${currentQuestion + 1} / ${questions.length}`;
    document.getElementById('question-container').innerHTML = `
        <div class="mb-5 font-semibold text-lg text-right arab">${q.q}</div>
        <div class="answers">${q.options.map((opt, i) => `<button onclick="selectAnswer(${i})">${formatArabic(opt)}</button>`).join('')}</div>
        <div id="exp" class="hidden mt-4 p-4 bg-blue-50 border-r-4 border-blue-500 text-sm text-right">
            <strong class="block mb-1">الشرح:</strong>
            ${formatArabic(q.exp)}
        </div>
    `;
    document.getElementById('nextBtn').classList.add('hidden');
    startTimer();
}

window.selectAnswer = (idx) => {
    clearInterval(countdown);
    const q = questions[currentQuestion];
    document.querySelectorAll('.answers button').forEach((b, i) => {
        b.disabled = true;
        if (i === q.a) b.classList.add('correct');
        if (i === idx && idx !== q.a) b.classList.add('wrong');
    });
    if (idx === q.a) {
        score++;
    } else {
        wrongQuestions.push(currentQuestion + 1);
    }
    document.getElementById('exp').classList.remove('hidden');
    document.getElementById('nextBtn').classList.remove('hidden');
};

document.getElementById('nextBtn').onclick = () => {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
};

async function showResult() {
    document.getElementById('quiz').classList.add('hidden');
    document.getElementById('result').classList.remove('hidden');
    const p = Math.round((score / questions.length) * 100);
    const cat = getCategoryData(p);
    
    document.getElementById('resName').innerText = userName;
    document.getElementById('resRegion').innerText = userRegion;
    document.getElementById('resQual').innerText = cat.qual;
    document.getElementById('resWrongNumbers').innerText = wrongQuestions.length > 0 ? wrongQuestions.join(', ') : "Gak ada cacat. Sempurna!";
    
    document.getElementById('scoreCircle').className = `w-32 h-32 rounded-full border-8 border-white/20 flex items-center justify-center text-5xl font-extrabold shadow-2xl ${cat.bg}`;
    document.getElementById('scoreCircle').innerText = p;

    if (p >= 70) confetti();

    try {
        await fetch(SCRIPT_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify({ name: userName, region: userRegion, score: p, wrong: wrongQuestions.join(','), token: currentUserToken }) 
        });
        
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        
        allData = (Array.isArray(data) ? data : (data.participants || [])).map(item => ({
            name: item.name || item[0], 
            region: item.region || item[1], 
            score: parseInt(item.score || item[2]) || 0, 
            wrong: item.wrong || item[3], 
            token: item.token || item[4]
        })).sort((a, b) => b.score - a.score);

        const rank = allData.findIndex(i => String(i.token) === String(currentUserToken)) + 1;
        document.getElementById('rankText').innerText = `Peringkat ${rank} dari ${allData.length} Peserta`;

        // Aktifkan Tombol
        const bS = document.getElementById('btnSertifikat');
        bS.disabled = false;
        bS.innerText = "🏆 Unduh Sertifikat";
        bS.classList.replace('bg-gray-200', 'bg-amber-500');
        bS.classList.replace('text-gray-400', 'text-white');
        bS.classList.remove('italic');

        const bR = document.getElementById('btnRaport');
        bR.disabled = false;
        bR.innerText = "📊 Lihat Raport & Rekapitulasi";
        bR.classList.replace('bg-gray-200', 'bg-gray-800');
        bR.classList.replace('text-gray-400', 'text-white');
        bR.classList.remove('italic', 'opacity-50');
        
    } catch (e) { 
        console.error(e);
        document.getElementById('rankText').innerText = "Gagal memuat peringkat.";
    }
}

function renderRaport() {
    const rL = document.getElementById('raportList');
    const aL = document.getElementById('analyticsList');
    
    rL.innerHTML = allData.map((p, i) => {
        const c = getCategoryData(p.score);
        const isMe = String(p.token) === String(currentUserToken);
        return `
        <div class="flex justify-between items-center p-3 border rounded-xl mb-2 ${c.lightBg} ${isMe ? 'ring-4 ring-blue-600 scale-[1.02] shadow-md' : 'border-gray-200'} transition-all">
            <div class="text-xs text-left">
                <div class="flex items-center gap-2">
                    <b class="text-gray-800 text-sm">${i + 1}. ${p.name}</b> 
                    ${isMe ? '<span class="bg-blue-600 text-white px-2 py-0.5 rounded-full text-[8px] animate-pulse">ANTUM</span>' : ''}
                </div>
                <span class="text-gray-500">${p.region}</span> • <span class="font-bold ${c.color}">${c.qual}</span>
            </div>
            <div class="text-right">
                <div class="font-black text-xl ${c.color}">${p.score}%</div>
            </div>
        </div>`;
    }).join('');

    let counts = {};
    allData.forEach(d => {
        if (d.wrong) {
            d.wrong.toString().split(',').forEach(num => {
                let n = num.trim();
                if (n) counts[n] = (counts[n] || 0) + 1;
            });
        }
    });
    
    aL.innerHTML = Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([num, count]) => `
            <div class="bg-white px-3 py-1 rounded-full border border-amber-300 text-[10px] font-bold text-amber-700 shadow-sm">
                Soal ${num}: ${count} Orang Salah
            </div>
        `).join('');
}

document.getElementById('btnRetry').onclick = () => { location.reload(); };

document.getElementById('btnRaport').onclick = () => { 
    renderRaport(); 
    document.getElementById('result').classList.add('hidden'); 
    document.getElementById('raportPage').classList.remove('hidden'); 
};

document.getElementById('btnBackToResult').onclick = () => { 
    document.getElementById('raportPage').classList.add('hidden'); 
    document.getElementById('result').classList.remove('hidden'); 
};

document.getElementById('btnSertifikat').onclick = () => {
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    const p = Math.round((score / questions.length) * 100);
    const cat = getCategoryData(p);
    const img = new Image();
    img.src = "cert-bg1.jpg"; 
    img.onload = () => {
        ctx.drawImage(img, 0, 0, 1200, 900);
        ctx.textAlign = "center"; 
        ctx.fillStyle = "#2c3e50";
        ctx.font = "bold 45px Montserrat"; 
        ctx.fillText(userName, 725, 291);
        
        ctx.textAlign = "left"; 
        ctx.font = "30px Montserrat"; 
        ctx.fillText(userRegion, 562, 370);
        
        ctx.fillStyle = cat.hex; 
        ctx.font = "bold 30px Montserrat"; 
        ctx.fillText(`${p}% (${cat.qual})`, 600, 558);
        
        const rank = allData.findIndex(i => String(i.token) === String(currentUserToken)) + 1;
        ctx.fillStyle = "#2c3e50"; 
        ctx.fillText(`${rank} dari ${allData.length} Peserta`, 487, 618);
        
        const link = document.createElement('a'); 
        link.download = `Sertifikat_${userName}.png`; 
        link.href = canvas.toDataURL(); 
        link.click();
    };
};
</script>
