<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Nahwu: Uji pemahaman Marfuat Asma'</title>
    <meta name="description" content="Uji pemahaman Marfuat Asma'">
    <meta property="og:title" content="Uji pemahaman Marfuat Asma'">
    <meta property="og:description" content="Ayo uji kemampuan Nahwu antum dengan kuis interaktif ini!">
    <meta property="og:image" content="https://arifabdrohim52-sys.github.io/Nahu/6.jpg">
    <meta property="og:url" content="https://arifabdrohim52-sys.github.io/Nahu/Kalam.html">
    <meta property="og:type" content="website">
    
    <!-- Google Fonts: Amiri, Montserrat, Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f4f6f8; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .quiz-container { 
            width: 95%; 
            max-width: 700px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            background: #fff; 
            overflow: hidden; 
        }
        .hidden { display: none; }
        
        /* Pengaturan Teks Arab & Direction */
        .auto-dir { unicode-bidi: plaintext; }
        .arab { 
            font-family: 'Amiri', serif !important; 
            font-size: 1.35em; 
            line-height: 2; 
        }
        
        /* Pilihan Jawaban */
        .answers button { 
            display: block; 
            width: 100%; 
            margin: 10px 0; 
            padding: 14px 18px; 
            border: 2px solid #3498db; 
            border-radius: 12px; 
            transition: .25s; 
            unicode-bidi: plaintext;
            text-align: center !important; 
        }
        .answers button.correct { 
            background: #2ecc71 !important; 
            color: #fff; 
            border-color: #27ae60; 
        }
        .answers button.wrong { 
            background: #e74c3c !important; 
            color: #fff; 
            border-color: #c0392b; 
        }
        .overlay-box { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(255,255,255,0.95); 
            padding: 2rem; 
            border-radius: 1.5rem; 
            width: 85%; 
            max-width: 380px; 
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); 
            backdrop-filter: blur(4px); 
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- HALAMAN INTRO -->
    <div id="intro" class="relative text-center">
        <img src="./4.png" alt="Sampul" class="w-full brightness-50 object-cover min-h-[450px]">
        <div class="overlay-box">
            <h1 class="text-xl font-bold mb-3 text-gray-800">Uji pemahaman Marfuat Asma'</h1>
            
            <!-- Tombol Intip Rank di Awal -->
            <button id="btnViewRankIntro" class="w-full py-2.5 mb-4 bg-amber-500 text-white font-semibold text-xs rounded-xl shadow-md hover:bg-amber-600 transition-all flex items-center justify-center gap-1.5">
                👁️ Intip Rank / Klasemen
            </button>

            <div class="border-t border-gray-200 pt-3">
                <input type="text" id="name" placeholder="Nama Antum" class="w-full p-3 mb-3 border rounded-xl outline-none focus:border-blue-500">
                <input type="text" id="region" placeholder="Daerah Antum" class="w-full p-3 mb-4 border rounded-xl outline-none focus:border-blue-500">
                <button id="btnStart" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition-all">Mulai Kuis</button>
            </div>
        </div>
    </div>

    <!-- HALAMAN KUIS -->
    <div id="quiz" class="hidden p-6">
        <div class="flex justify-between items-center mb-4">
            <span id="question-label" class="text-blue-600 font-bold text-xs uppercase tracking-widest"></span>
            <div id="timer-display" class="bg-red-100 text-red-600 px-4 py-1 rounded-full font-bold">⏱️ <span id="time-left">60</span>s</div>
        </div>
        <div id="question-container"></div>
        <button id="nextBtn" class="hidden w-full mt-6 py-3 bg-blue-600 text-white font-bold rounded-xl">Lanjut ➡️</button>
    </div>

    <!-- HALAMAN HASIL -->
    <div id="result" class="hidden p-0 text-center">
        <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-8 text-white">
            <h1 class="text-xl font-semibold opacity-90 mb-2">Tes Selesai!</h1>
            <div class="flex justify-center my-4">
                <div class="relative">
                    <div id="scoreCircle" class="w-32 h-32 rounded-full border-8 border-white/20 flex items-center justify-center text-5xl font-extrabold shadow-2xl transition-all duration-1000">0</div>
                    <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-white text-blue-600 px-4 py-1 rounded-full text-[10px] font-bold shadow-md whitespace-nowrap uppercase">SKOR AKHIR</div>
                </div>
            </div>
            <p id="resQual" class="text-lg font-bold mb-1"></p>
            <div id="rankText" class="text-sm opacity-80 font-medium italic">Memproses data...</div>
        </div>

        <div class="p-8 bg-white">
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="text-left p-3 rounded-xl bg-gray-50 border border-gray-100">
                    <p class="text-[10px] uppercase text-gray-400 font-bold">Nama</p>
                    <p id="resName" class="font-semibold text-gray-700 truncate"></p>
                </div>
                <div class="text-left p-3 rounded-xl bg-gray-50 border border-gray-100">
                    <p class="text-[10px] uppercase text-gray-400 font-bold">Daerah</p>
                    <p id="resRegion" class="font-semibold text-gray-700 truncate"></p>
                </div>
            </div>

            <div class="mb-8 p-4 rounded-2xl bg-red-50 border border-red-100 text-left">
                <p class="text-xs font-bold text-red-800 uppercase mb-1">Perlu Muraja'ah Soal:</p>
                <p id="resWrongNumbers" class="text-sm text-red-700 font-medium"></p>
            </div>
            
            <div class="space-y-3">
                <button id="btnSertifikat" disabled class="w-full py-4 bg-gray-200 text-gray-400 font-bold rounded-2xl cursor-not-allowed transition-all italic">⏳ Tunggu Sertifikat...</button>
                <button id="btnRaport" disabled class="w-full py-4 bg-gray-200 text-gray-400 font-bold rounded-2xl transition-all opacity-50 italic">⏳ Tunggu Raport...</button>
                <button id="btnRetry" class="w-full py-4 bg-blue-100 text-blue-700 font-bold rounded-2xl hover:bg-blue-200 transition-all border border-blue-200">🔄 Ulangi Kuis</button>
            </div>
        </div>
    </div>

    <!-- HALAMAN RAPORT GLOBAL -->
    <div id="raportPage" class="hidden p-6">
        <h1 class="text-xl font-bold mb-4 text-center text-gray-800 italic underline">Raport Global</h1>
        
        <div class="mb-6 p-4 bg-amber-50 rounded-2xl border border-amber-200 text-left">
            <h3 class="text-xs font-bold text-amber-800 uppercase mb-3 flex items-center gap-2">⚠️ Rekapitulasi Soal Sulit (Global)</h3>
            <div id="analyticsList" class="flex flex-wrap gap-2"></div>
        </div>

        <h3 class="text-xs font-bold text-gray-400 uppercase mb-3 text-left">Peringkat & Kualifikasi Peserta</h3>
        <div id="raportList" class="space-y-2 max-h-80 overflow-y-auto pr-2"></div>
        <button id="btnBackToPrevious" class="w-full mt-6 py-3 bg-gray-800 text-white rounded-xl font-bold">Kembali</button>
    </div>
</div>

<canvas id="certCanvas" width="1200" height="900" class="hidden"></canvas>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzllXMsKSYHCjTTYTR97YC8A1Bh4jqpRsth_s_B0pEmzYmD2Bd-VfBjOPgT2TQWGwXz/exec";

let currentUserToken = '';
let currentQuestion = 0;
let score = 0;
let userName = '';
let userRegion = '';
let countdown;
let timeLeft = 60;
let allData = [];
let wrongQuestions = [];
let previousPage = 'intro';

const questions = [
    {
        q: "Mana yang merupakan contoh khabar syibh jumlah?",
        options: ["محمدٌ قائمٌ", "محمدٌ في الدارِ", "محمدٌ قامَ أبوهُ", "محمدٌ أخوكَ"],
        a: 1,
        exp: "في الدارِ terdiri dari jar-majrur yang menduduki posisi khabar syibh jumlah."
    },
    {
        q: "Tentukan kedudukan fa'il يسر pada kalimat <br> يسرُّني أن ألتقيَ بك",
        options: ["Dhomir mustatir أنا yang tersembunyi pada ألتقي", "Dhomir الياء pada يسرني", "Masdhar Mu'awwal أن ألتقي", "Tidak memiliki fa'il"],
        a: 2,
        exp: "Kalimat أن ألتقي di-ta'wil menjadi masdhar sharih لقاؤُك yang berposisi sebagai marfu' (fa'il dari يسرُّ). Takdir kalimatnya: يسرُّني لقاؤُك."
    },
    {
        q: "Tentukan fa'il dari fi'il pada kalimat <br>ضربتُما محمداً",
        options: ["ألف", "التاء", "تما", "الميم والألف"],
        a: 0,
        exp: "Fa'ilnya adalah Alif Itsnain, sedangkan التاء adalah harful khitab, dan الميم adalah harf 'imad (penopang)."
    },
    {
        q: "Bagaimana cara menjadikan masdhar pada kalimat <br> صام صوماً <br> sebagai Na'ib Fa'il?",
        options: ["Langsung diubah menjadi صِيمَ صَوْمٌ", "Tidak bisa dijadikan na'ib fa'il sama sekali", "Harus disifati (na'at) atau di-idhafahkan, contohnya صِيمَ صَوْمُ رمضانَ", "Mengubah fi'il menjadi isim fa'il"],
        a: 2,
        exp: "Masdhar yang bersifat mubham (umum) tidak boleh menjadi na'ib fa'il kecuali jika di-spesifikkan (mukhtas) melalui sifat atau idhafah (seperti صيم صومُ رمضانَ)."
    },
    {
        q: "Apakah benar susunan mubtada' dan khabar pada kalimat <br> زيدونَ قائمونَ",
        options: ["Benar, karena زيدون adalah isim 'alam ma'rifah'", "Salah, karena tidak ma'rifah", "Benar, karena keduanya jamak muzakkar salim", "Salah, karena khabar harus mufrad"],
        a: 1,
        exp: "Mubtada' harus marifah, Isim 'alam yang dijamakkan (tankir) status ke-ma'rifah-annya hilang, sehingga membutuhkan أل untuk menjadi ma'rifah kembali sebagai mubtada'."
    },
    {
        q: "Mengapa pada kalimat <br> كان محمدٌ نائماً <br> tidak terdapat fa'il?",
        options: ["Fa'ilnya محمد", "Karena كان adalah fi'il naqish", "Karena كان fi'il tam", "Karena كان fi'il jamid"],
        a: 1,
        exp: "كان tidak memiliki makna perbuatan utuh (hadats khas), sehingga keterangannya berpindah menjadi khabar كان dan isimnya disebut Isim Kana, bukan fa'il."
    },
    {
        q: "Apakah fi'il (وجدتُ) yang bermakna \"menemukan\" menashobkan dua maf'ul bihi?",
        options: ["Ya, selalu menashobkan dua maf'ul", "Tidak, hanya menashobkan satu maf'ul bihi", "Tidak menashobkan maf'ul sama sekali", "Menashobkan tiga maf'ul"],
        a: 1,
        exp: "Fi'il وجَد hanya menashobkan dua maf'ul jika tergolong Af'alul Qulub bermakna عَلِمْتُ (meyakini/mengetahui). Jika bermakna menemukan benda konkret, ia tergolong fi'il muta'addi biasa dengan satu maf'ul bihi."
    },
    {
        q: "Apa jenis na'at pada jumlah <br> مررتُ بعمرَ العدلِ",
        options: ["Na'at Haqiqi Musytaq", "Na'at Sababi", "Na'at Mu'awwal bil Musytaq", "Na'at Jumlah"],
        a: 2,
        exp: "Kata العدل adalah masdhar (jamid), tetapi berposisi sebagai na'at karena di-ta'wil dengan isim musytaq, yaitu ذِي العَدْلِ atau العَادِلِ."
    },
    {
        q: "Apakah kata أحمد berposisi sebagai badal pada kalimat <br> حضر شيخ أحمد",
        options: ["Tidak, karena شيخ nakiroh sedangkan أحمد ma'rifah", "Ya, dapat berposisi sebagai Badal, sama-sama tidak ada al", "Tidak, ia berposisi sebagai khabar", "Tidak, ia berposisi sebagai mudhaf ilaih"],
        a: 3,
        exp: "أحمد adalah nama orang ('alam) yang merupakan ma'rifah, dan شيخ adalah nakirah maka tidak bisa jadi badal. Ia berposisi sebagai mudhaf ilaih, artinya telah hadir gurunya Ahmad, bukan Ahmad itu sendiri."
    },
    {
        q: "Apa jenis أل pada kata الشيخ yang kedua dalam kalimat <br> لقيتُ بالشيخِ أحمدَ، والشيخُ نصحَني",
        options: ["أل Jinsiyyah", "أل 'Ahdiyyah Dzikriyyah", "أل 'Ahdiyyah Hudhūriyyah", "أل Zā'idah"],
        a: 1,
        exp: "أل tersebut merujuk pada sosok الشيخ yang sudah disebutkan sebelumnya dalam teks (dzikriyyah)."
    },
    {
        q: "Apa i'rab dari kata أثاثَ pada kalimat <br> اشتريتُ الدارَ حتى أثاثَها",
        options: ["Badal isytimal", "Ma'thūf", "Majrur hatta", "Taukīd ma'nawī manshūb"],
        a: 1,
        exp: "Kata حتى di sini berfungsi sebagai huruf athaf (harf 'athf ghāyah), sehingga أثاثَ di-i'rab sebagai ma'thuf yang mengikuti الدارَ (manshub). Bukan majrur hatta karena bukan ghayah zamaniyyah atau makaniyyah."
    },
    {
        q: "Kalimat manakah di bawah ini yang memuat Taukid Ma'nawi?",
        options: ["قرأتُ الكتابَ بعضَهُ", "قرأتُ الكتابَ كلَّهُ", "قرأتُ الكتابَ قراءةً", "قرأتُ الكتابَ صفحاتِهِ"],
        a: 1,
        exp: "Kata كلَّهُ adalah lafaz Taukid Ma'nawi yang bersambung dengan dhomir pengikat (ه). Pilihan A adalah Badal Ba'dh min Kul, C adalah Maf'ul Muthlaq, dan D adalah Badal Isytimal."
    },
    {
        q: "Siapakah yang dipastikan datang pada kalimat <br> جاء محمدٌ بل عمرٌو",
        options: ["Muhammad saja", "Amr saja", "Muhammad dan Amr", "Tidak ada yang datang"],
        a: 1,
        exp: "Huruf بل setelah kalimat positif (kalam itsbat/ijab) berfungsi sebagai idhrāb (memalingkan hukum dari kata sebelumnya dan menetapkannya untuk kata setelahnya, sehingga kata sebelumnya menjadi maskut 'anhu)."
    },
    {
        q: "Apakah huruf لكنْ pada kalimat <br> محمدٌ غنيٌّ لكنَّهُ بخيلٌ <br> tergolong huruf 'Athaf?",
        options: ["Tidak, tapi huruf jar", "Tidak, melainkan Akhawātu Inna", "Tidak, tapi akhawat kana", "Iya, dia huruf athaf"],
        a: 1,
        exp: "Pada kalimat tersebut, lafaznya berharakat tasydid (لكنَّهُ), yaitu لَكِنَّ (dari Akhawātu Inna) yang masuk pada jumlah (isim + khabar), bukan لَكِنْ sukun yang merupakan huruf 'athaf untuk mufrad."
    }
];

function formatText(text) { 
    return text.replace(/([\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+)/g, '<span class="arab">$1</span>');
}

function getCategoryData(p) {
    if (p >= 90) return { qual: "Mumtaz", color: "text-green-600", bg: "bg-green-600", hex: "#16a34a", lightBg: "bg-green-50" };
    if (p >= 80) return { qual: "Jayyid Jiddan", color: "text-blue-600", bg: "bg-blue-600", hex: "#2563eb", lightBg: "bg-blue-50" };
    if (p >= 65) return { qual: "Jayyid", color: "text-yellow-600", bg: "bg-yellow-600", hex: "#ca8a04", lightBg: "bg-yellow-50" };
    if (p >= 50) return { qual: "Maqbul", color: "text-orange-600", bg: "bg-orange-600", hex: "#ea580c", lightBg: "bg-orange-50" };
    return { qual: "Rasib", color: "text-red-600", bg: "bg-red-600", hex: "#dc2626", lightBg: "bg-red-50" };
}

function startTimer() {
    clearInterval(countdown);
    timeLeft = 60;
    document.getElementById('time-left').innerText = timeLeft;
    countdown = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft;
        if (timeLeft <= 0) { 
            clearInterval(countdown); 
            handleTimeout(); 
        }
    }, 1000);
}

function handleTimeout() {
    const q = questions[currentQuestion];
    document.querySelectorAll('.answers button').forEach((b, i) => {
        b.disabled = true;
        if (i === q.a) b.classList.add('correct');
    });
    wrongQuestions.push(currentQuestion + 1);
    document.getElementById('exp').innerHTML = `<div class="text-red-600 font-bold mb-2 text-left">⏰ Waktu Habis! Poin soal ini hangus.</div><strong class="block auto-dir" dir="auto"><span class="arab">الشرح</span> / Penjelasan:</strong><br>${formatText(q.exp)}`;
    document.getElementById('exp').classList.remove('hidden');
    document.getElementById('nextBtn').classList.remove('hidden');
}

document.getElementById('btnStart').onclick = () => {
    userName = document.getElementById('name').value.trim();
    userRegion = document.getElementById('region').value.trim();
    if (!userName || !userRegion) return alert("Isi Nama & Daerah!");
    currentUserToken = "ID-" + Date.now();
    document.getElementById('intro').classList.add('hidden');
    document.getElementById('quiz').classList.remove('hidden');
    loadQuestion();
};

function loadQuestion() {
    const q = questions[currentQuestion];
    document.getElementById('question-label').innerText = `Soal ${currentQuestion + 1} / ${questions.length}`;
    document.getElementById('question-container').innerHTML = `
        <div class="mb-5 font-semibold text-lg text-center auto-dir" dir="auto">${formatText(q.q)}</div>
        <div class="answers">${q.options.map((opt, i) => `<button dir="auto" onclick="selectAnswer(${i})">${formatText(opt)}</button>`).join('')}</div>
        <div id="exp" class="hidden mt-4 p-4 bg-blue-50 border-r-4 border-blue-500 text-sm text-left auto-dir" dir="auto">
            <strong class="block mb-1 auto-dir" dir="auto"><span class="arab">الشرح</span> / Penjelasan:</strong>
            ${formatText(q.exp)}
        </div>
    `;
    document.getElementById('nextBtn').classList.add('hidden');
    startTimer();
}

window.selectAnswer = (idx) => {
    clearInterval(countdown);
    const q = questions[currentQuestion];
    document.querySelectorAll('.answers button').forEach((b, i) => {
        b.disabled = true;
        if (i === q.a) b.classList.add('correct');
        if (i === idx && idx !== q.a) b.classList.add('wrong');
    });
    if (idx === q.a) {
        score++;
    } else {
        wrongQuestions.push(currentQuestion + 1);
    }
    document.getElementById('exp').classList.remove('hidden');
    document.getElementById('nextBtn').classList.remove('hidden');
};

document.getElementById('nextBtn').onclick = () => {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
};

async function showResult() {
    document.getElementById('quiz').classList.add('hidden');
    document.getElementById('result').classList.remove('hidden');
    const p = Math.round((score / questions.length) * 100);
    const cat = getCategoryData(p);
    
    document.getElementById('resName').innerText = userName;
    document.getElementById('resRegion').innerText = userRegion;
    document.getElementById('resQual').innerText = cat.qual;
    document.getElementById('resWrongNumbers').innerText = wrongQuestions.length > 0 ? wrongQuestions.join(', ') : "Gak ada cacat. Sempurna!";
    
    document.getElementById('scoreCircle').className = `w-32 h-32 rounded-full border-8 border-white/20 flex items-center justify-center text-5xl font-extrabold shadow-2xl ${cat.bg}`;
    document.getElementById('scoreCircle').innerText = p;

    if (p >= 70) confetti();

    try {
        await fetch(SCRIPT_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify({ name: userName, region: userRegion, score: p, wrong: wrongQuestions.join(','), token: currentUserToken }) 
        });
        
        await fetchRankingData();

        const rank = allData.findIndex(i => String(i.token) === String(currentUserToken)) + 1;
        document.getElementById('rankText').innerText = rank > 0 ? `Peringkat ${rank} dari ${allData.length} Peserta` : `Data tersimpan`;

        const bS = document.getElementById('btnSertifikat');
        bS.disabled = false;
        bS.innerText = "🏆 Unduh Sertifikat";
        bS.classList.replace('bg-gray-200', 'bg-amber-500');
        bS.classList.replace('text-gray-400', 'text-white');
        bS.classList.remove('italic');

        const bR = document.getElementById('btnRaport');
        bR.disabled = false;
        bR.innerText = "📊 Lihat Raport & Rekapitulasi";
        bR.classList.replace('bg-gray-200', 'bg-gray-800');
        bR.classList.replace('text-gray-400', 'text-white');
        bR.classList.remove('italic', 'opacity-50');
        
    } catch (e) { 
        console.error(e);
        document.getElementById('rankText').innerText = "Gagal memuat peringkat.";
    }
}

async function fetchRankingData() {
    try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        
        const list = Array.isArray(data) ? data : (data.participants || []);
        
        allData = list
            .map(item => {
                if (Array.isArray(item)) {
                    return {
                        name: item[0] ? String(item[0]).trim() : '',
                        region: item[1] ? String(item[1]).trim() : '-',
                        score: parseInt(item[2]) || 0,
                        wrong: item[3] || '',
                        token: item[4] ? String(item[4]).trim() : ''
                    };
                } else {
                    return {
                        name: item.name ? String(item.name).trim() : '',
                        region: item.region ? String(item.region).trim() : '-',
                        score: parseInt(item.score) || 0,
                        wrong: item.wrong || '',
                        token: item.token ? String(item.token).trim() : ''
                    };
                }
            })
            // FILTER UTAMA: Hanya ambil data jika nama tidak kosong, bukan undefined, dan bukan kata "nama"
            .filter(item => item.name !== '' && item.name !== 'undefined' && item.name.toLowerCase() !== 'nama')
            .sort((a, b) => b.score - a.score);

    } catch(e) {
        console.error("Gagal mengambil data ranking:", e);
        allData = [];
    }
}

function renderRaport() {
    const rL = document.getElementById('raportList');
    const aL = document.getElementById('analyticsList');
    
    if (allData.length === 0) {
        rL.innerHTML = `<div class="text-center text-gray-500 py-8 text-sm italic bg-gray-50 rounded-xl border border-dashed border-gray-300">Belum ada peserta yang menyelesaikan kuis.</div>`;
        aL.innerHTML = `<div class="text-xs text-gray-400 italic">Belum ada data kesalahan.</div>`;
        return;
    }

    rL.innerHTML = allData.map((p, i) => {
        const c = getCategoryData(p.score);
        // "ANTUM" hanya ditandai jika currentUserToken aktif dan cocok
        const isMe = currentUserToken !== '' && p.token !== '' && String(p.token) === String(currentUserToken);
        
        return `
        <div class="flex justify-between items-center p-3 border rounded-xl mb-2 ${c.lightBg} ${isMe ? 'ring-4 ring-blue-600 scale-[1.02] shadow-md' : 'border-gray-200'} transition-all">
            <div class="text-xs text-left">
                <div class="flex items-center gap-2">
                    <b class="text-gray-800 text-sm">${i + 1}. ${p.name}</b> 
                    ${isMe ? '<span class="bg-blue-600 text-white px-2 py-0.5 rounded-full text-[8px] animate-pulse">ANTUM</span>' : ''}
                </div>
                <span class="text-gray-500">${p.region}</span> • <span class="font-bold ${c.color}">${c.qual}</span>
            </div>
            <div class="text-right">
                <div class="font-black text-xl ${c.color}">${p.score}%</div>
            </div>
        </div>`;
    }).join('');

    let counts = {};
    allData.forEach(d => {
        if (d.wrong) {
            d.wrong.toString().split(',').forEach(num => {
                let n = num.trim();
                if (n) counts[n] = (counts[n] || 0) + 1;
            });
        }
    });
    
    const sortedAnalytics = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
    
    if (sortedAnalytics.length > 0) {
        aL.innerHTML = sortedAnalytics.map(([num, count]) => `
            <div class="bg-white px-3 py-1 rounded-full border border-amber-300 text-[10px] font-bold text-amber-700 shadow-sm">
                Soal ${num}: ${count} Orang Salah
            </div>
        `).join('');
    } else {
        aL.innerHTML = `<div class="text-xs text-gray-400 italic">Belum ada data kesalahan.</div>`;
    }
}

document.getElementById('btnRetry').onclick = () => { location.reload(); };

// Tombol Intip Rank di Halaman Intro
document.getElementById('btnViewRankIntro').onclick = async () => {
    const btn = document.getElementById('btnViewRankIntro');
    const originalText = btn.innerText;
    btn.innerText = "⏳ Memuat Klasemen...";
    btn.disabled = true;

    previousPage = 'intro';
    await fetchRankingData();
    renderRaport();

    btn.innerText = originalText;
    btn.disabled = false;

    document.getElementById('intro').classList.add('hidden');
    document.getElementById('raportPage').classList.remove('hidden');
};

// Tombol Lihat Raport di Halaman Hasil
document.getElementById('btnRaport').onclick = () => { 
    previousPage = 'result';
    renderRaport(); 
    document.getElementById('result').classList.add('hidden'); 
    document.getElementById('raportPage').classList.remove('hidden'); 
};

// Tombol Kembali
document.getElementById('btnBackToPrevious').onclick = () => { 
    document.getElementById('raportPage').classList.add('hidden'); 
    if (previousPage === 'intro') {
        document.getElementById('intro').classList.remove('hidden');
    } else {
        document.getElementById('result').classList.remove('hidden');
    }
};

document.getElementById('btnSertifikat').onclick = () => {
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    const p = Math.round((score / questions.length) * 100);
    const cat = getCategoryData(p);
    const img = new Image();
    img.src = "cert-bg1.jpg"; 
    img.onload = () => {
        ctx.drawImage(img, 0, 0, 1200, 900);
        ctx.textAlign = "center"; 
        ctx.fillStyle = "#2c3e50";
        ctx.font = "bold 45px Montserrat"; 
        ctx.fillText(userName, 725, 291);
        
        ctx.textAlign = "left"; 
        ctx.font = "30px Montserrat"; 
        ctx.fillText(userRegion, 562, 370);
        
        ctx.fillStyle = cat.hex; 
        ctx.font = "bold 30px Montserrat"; 
        ctx.fillText(`${p}% (${cat.qual})`, 600, 558);
        
        const rank = allData.findIndex(i => String(i.token) === String(currentUserToken)) + 1;
        ctx.fillStyle = "#2c3e50"; 
        ctx.fillText(`${rank > 0 ? rank : 1} dari ${allData.length} Peserta`, 487, 618);
        
        const link = document.createElement('a'); 
        link.download = `Sertifikat_${userName}.png`; 
        link.href = canvas.toDataURL(); 
        link.click();
    };
};
</script>
